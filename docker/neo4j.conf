# Embedded Neo4j for the Hugging Face Space container.
#
# This instance is private to the container: it listens on the loopback
# interface only, HTTP is disabled, and nothing outside the container can reach
# it. Auth is therefore OFF -- a password here would protect nothing (anyone who
# can open a bolt socket to 127.0.0.1 is already inside the container) and would
# be one more secret to manage. The app's driver still passes NEO4J_USER /
# NEO4J_PASSWORD; Neo4j ignores them when auth is disabled.
dbms.security.auth_enabled=false

# Loopback only. No HTTP/HTTPS connector at all -- the app speaks bolt.
server.default_listen_address=127.0.0.1
server.bolt.enabled=true
server.bolt.listen_address=127.0.0.1:7687
server.http.enabled=false
server.https.enabled=false

# Memory, sized for the HF free tier (2 vCPU / 16 GB) with torch models
# (~1.5 GB resident) sharing the box. The graph is 98 nodes / 236 rels; a 1 GB
# heap is generous and 128 MB of page cache is more than the store will ever be.
server.memory.heap.initial_size=512m
server.memory.heap.max_size=1G
server.memory.pagecache.size=128m

# Data is ephemeral by design: start.sh rebuilds the graph from data/raw on
# every boot, so nothing here needs to survive a restart.
server.directories.data=/var/lib/neo4j/data
server.directories.logs=/var/log/neo4j
server.directories.run=/var/lib/neo4j/run
server.directories.import=/var/lib/neo4j/import

# Keep the JVM quiet and small.
server.jvm.additional=-XX:+UseG1GC
server.jvm.additional=-XX:-OmitStackTraceInFastThrow
server.jvm.additional=-Djdk.tls.ephemeralDHKeySize=2048
server.jvm.additional=-Dlog4j2.disable.jmx=true
db.tx_log.rotation.retention_policy=1 files
dbms.usage_report.enabled=false
server.config.strict_validation.enabled=true
