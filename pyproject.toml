[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genai-capstone"
version = "0.1.0"
description = "Enterprise Knowledge Assistant - hybrid vector+graph RAG with agentic tool use"
requires-python = ">=3.11,<3.12"

dependencies = [
  # Phase 0 - credential checking
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3",
  # Datastores
  "qdrant-client>=1.9",
  "neo4j>=5.21",
  # Ingestion
  "pypdf>=4.2",
  "pandas>=2.2",
  # Embeddings + rerank (local, CPU)
  "sentence-transformers>=3.0",
  # Agent + LLM
  "langgraph>=0.2.28",
  "langchain-openai>=0.2",
  "langchain-core>=0.3",
  "tavily-python>=0.5",
  # Guardrails
  "nemoguardrails>=0.11",
  "presidio-analyzer>=2.2.355",
  "presidio-anonymizer>=2.2.355",
  # Serving + UI
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "streamlit>=1.38",
  # Observability
  "langfuse>=2.50,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.6"]
# RAGAS pins conflict with the app's langchain range; installed separately.
# See evals/ragas/README.md for the isolated-venv instructions.
eval = ["locust>=2.29"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
